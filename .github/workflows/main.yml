name: Django CI/CD Pipeline

on:
  push:
    branches: [ "docker-homework", "main", "master" ]
  pull_request:
    branches: [ "docker-homework", "main", "master" ]

jobs:
  # ЭТАП 1: ТЕСТЫ, ФОРМАТИРОВАНИЕ И ЛИНТЕР
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black

      - name: Check code formatting with Black
        run: black --check .

      - name: Run Linter (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Django tests
        run: python manage.py test

  # ЭТАП 2: СБОРКА ОБРАЗА В GITHUB ACTIONS И ПУШ НА DOCKER HUB
  build_and_push:
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: serikus/skypro_lms:latest

  # ЭТАП 3: ДЕПЛОЙ НА СЕРВЕРЕ
  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Copy config files via SSH (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "docker-compose.yaml,nginx.conf"
          target: "/home/skypro/lms_project"


      - name: Run Docker Compose on Remote Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /home/skypro/lms_project
            
            # Динамически создаем .env из безопасных секретов GitHub
            echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}" >> .env
            echo "CELERY_RESULT_BACKEND=${{ secrets.CELERY_RESULT_BACKEND }}" >> .env
            
            # Скачиваем обновленный с Docker Hub образ
            sudo docker compose pull
            
            # Перезапускаем контейнеры без удаления volumes 
            sudo docker compose up -d --remove-orphans
            
            # Удаляем старые зависшие образы, чтобы освободить место на ВМ
            sudo docker image prune -f
