name: Django CI/CD Pipeline

on:
  push:
    branches: [ "docker-homework", "main", "master" ]
  pull_request:
    branches: [ "docker-homework", "main", "master" ]

jobs:
  # ЭТАП 1: ТЕСТЫ, ФОРМАТИРОВАНИЕ И ЛИНТЕР
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black

      - name: Check code formatting with Black
        run: |
          black --check .

      - name: Run Linter (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Django tests
        run: |
          python manage.py test

  # ЭТАП 2: ДЕПЛОЙ И СБОРКА НА СЕРВЕРЕ ПО SSH
  deploy:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Deploy and Build on Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            mkdir -p /app/lms_project && cd /app/lms_project
            if [ -d ".git" ]; then
              git reset --hard
              git pull origin docker-homework
            else
              git clone -b docker-homework https://github.com .
            fi
            docker compose up -d --build --remove-orphans
            docker image prune -f
