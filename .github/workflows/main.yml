name: Django CI/CD Pipeline


on:
  push:
    branches: [ "docker-homework", "main", "master" ]
  pull_request:
    branches: [ "docker-homework", "main", "master" ]

jobs:

  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./LMS_project
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black


      - name: Check code formatting with Black
        run: |
          black --check config lms users


      - name: Run Linter (flake8)
        run: |
          flake8 config lms users --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 config lms users --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics


      - name: Run Django tests
        run: |
          python manage.py test


  build_and_push:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/web:latest


  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Переходим в папку с проектом на сервере
            cd /app/LMS_project || mkdir -p /app/LMS_project && cd /app/LMS_project
            
            # Авторизуемся в реестре образов на сервере
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Скачиваем обновленный Docker-образ нашего приложения
            docker compose pull
            
            # Перезапускаем контейнеры в фоновом режиме с применением изменений
            docker compose up -d --remove-orphans
            
            # Очищаем старые неиспользуемые Docker-образы для экономии места
            docker image prune -f
