name: Django CI/CD Pipeline

on:
  push:
    branches: [ "docker-homework", "main", "master" ]
  pull_request:
    branches: [ "docker-homework", "main", "master" ]

jobs:
  #ЭТАП 1: ТЕСТЫ, ФОРМАТИРОВАНИЕ И ЛИНТЕР
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black

      - name: Check code formatting with Black
        run: |
          black --check .

      - name: Run Linter (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Django tests
        run: |
          python manage.py test

  #ЭТАП 2: ДЕПЛОЙ И СБОРКА НА СЕРВЕРЕ ПО SSH
  deploy:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Копируем файлы проекта на сервер в Яндексе
      - name: Copy files via SSH (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "."
          target: "/home/skypro/lms_project"

      # Запускаем Docker Compose
      - name: Run Docker Compose on Remote Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /home/skypro/lms_project
            cp ~/.env .env
            
            
            sudo docker compose -f docker-compose.yaml down -v
            
            sudo docker compose -f docker-compose.yaml up -d --build --remove-orphans
            sudo docker image prune -f
